<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athens Diary</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Sans+JP:wght@300;400;500&family=DM+Mono:wght@300;400&display=swap');

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #f5f0e8;
            --bg-panel: #faf7f2;
            --text: #2c2a26;
            --text-muted: #8a857a;
            --accent: #c45a3c;
            --border: #ddd6c9;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 300;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        /* Loading Overlay */
        #loading {
            position: fixed; inset: 0; background: var(--bg); z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            font-family: 'DM Mono', monospace; font-size: 12px; color: var(--accent);
            transition: opacity 0.5s;
        }

        .header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            padding: 16px 28px 14px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-panel);
            z-index: 100;
        }
        .header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 300;
            font-size: 26px;
            letter-spacing: 0.02em;
        }
        .header h1 em { font-style: italic; color: var(--accent); }
        
        .header-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .toggle-group {
            display: flex;
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            background: #fff;
        }
        .toggle-btn {
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.04em;
            padding: 5px 12px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }
        .toggle-btn.active {
            background: var(--text);
            color: var(--bg);
        }

        .main { display: flex; height: calc(100vh - 56px); }

        .sidebar {
            width: 380px; min-width: 380px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column;
            position: relative; overflow: hidden;
        }
        .sidebar-top {
            padding: 14px 22px 10px;
            border-bottom: 1px solid var(--border);
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            color: var(--text-muted);
            display: flex; justify-content: space-between;
        }
        .entries { flex: 1; overflow-y: auto; padding: 4px 0; }
        .entries::-webkit-scrollbar { width: 4px; }
        .entries::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .entry {
            padding: 14px 22px;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }
        .entry:hover { background: rgba(196,90,60,0.04); }
        .entry.active {
            background: rgba(196,90,60,0.07);
            border-left-color: var(--accent);
        }
        .entry-date {
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
            display: flex; align-items: center; gap: 8px;
        }
        .entry-date .tag {
            font-size: 9px;
            padding: 1px 7px;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-muted);
            max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .entry-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 18px;
            font-weight: 400;
            line-height: 1.3;
            margin-bottom: 6px;
        }
        .entry-excerpt {
            font-size: 12.5px;
            line-height: 1.7;
            color: var(--text-muted);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .sub-entry {
            padding: 10px 22px 10px 34px;
            cursor: pointer;
            transition: all 0.15s;
            border-left: 3px solid transparent;
        }
        .sub-entry:hover { background: rgba(196,90,60,0.03); }
        .sub-entry .sub-date {
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            color: var(--text-muted);
            margin-bottom: 3px;
        }
        .sub-entry .sub-excerpt {
            font-size: 12px;
            line-height: 1.6;
            color: var(--text-muted);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .detail-overlay {
            position: absolute; inset: 0;
            background: var(--bg-panel);
            z-index: 10;
            overflow-y: auto;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
        }
        .detail-overlay.open { transform: translateX(0); }
        .detail-back {
            display: block;
            padding: 14px 22px;
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            color: var(--text-muted);
            cursor: pointer;
            border: none; background: none;
        }
        .detail-back:hover { color: var(--text); }
        .detail-content { padding: 0 22px 40px; }
        .detail-date {
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .detail-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 24px;
            font-weight: 400;
            line-height: 1.35;
            margin-bottom: 18px;
        }
        .detail-body { font-size: 13.5px; line-height: 2; color: #4a4740; }
        .detail-body p { margin-bottom: 0.8em; }

        .map-wrap { flex: 1; position: relative; }
        #map { height: 100%; width: 100%; }

        .pin {
            width: 13px; height: 13px;
            background: var(--accent);
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(196,90,60,0.35);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .pin.highlight {
            transform: scale(1.6);
            box-shadow: 0 2px 14px rgba(196,90,60,0.55);
        }

        .leaflet-popup-content-wrapper { border-radius: 4px; box-shadow: 0 4px 20px rgba(0,0,0,0.12); }
        .leaflet-popup-content { margin: 14px 16px; font-size: 13px; line-height: 1.6; }
        .popup-date { font-family: 'DM Mono', monospace; font-size: 10px; color: #8a857a; margin-bottom: 3px; }
        .popup-title { font-family: 'Cormorant Garamond', serif; font-size: 17px; margin-bottom: 6px; }
        .popup-body { color: #5a5750; font-weight: 300; font-size: 12.5px; }

        @media (max-width: 800px) {
            .main { flex-direction: column-reverse; }
            .sidebar { width: 100%; min-width: unset; height: 45vh; border-right: none; border-top: 1px solid var(--border); }
            .map-wrap { height: 55vh; }
            .header { flex-wrap: wrap; gap: 8px; padding: 10px 16px; }
            .header-controls { gap: 10px; width: 100%; justify-content: space-between; }
        }
    </style>
</head>
<body>

<div id="loading">FETCHING DATA...</div>

<div class="header">
    <h1><em>Athens</em> Diary</h1>
    <div class="header-controls">
        <div class="toggle-group" id="langToggle">
            <button class="toggle-btn active" data-lang="jp">JP</button>
            <button class="toggle-btn" data-lang="en">EN</button>
            <button class="toggle-btn" data-lang="gr">GR</button>
        </div>
        <div class="toggle-group" id="modeToggle">
            <button class="toggle-btn active" data-mode="date">DATE</button>
            <button class="toggle-btn" data-mode="place">PLACE</button>
        </div>
    </div>
</div>

<div class="main">
    <div class="sidebar">
        <div class="sidebar-top">
            <span id="entryCount">0 entries</span>
            <span id="currentStatus" style="font-size: 9px; opacity: 0.6;"></span>
        </div>
        <div class="entries" id="entriesList"></div>
        <div class="detail-overlay" id="detailOverlay">
            <button class="detail-back" id="detailBack">← BACK</button>
            <div class="detail-content" id="detailContent"></div>
        </div>
    </div>
    <div class="map-wrap">
        <div id="map"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  設定とグローバル変数
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const RAW_BASE_URL = "https://raw.githubusercontent.com/Soyadayo/tacolv/main/";
let currentLang = "jp";
let currentMode = "date";
let dateEntries = [];
let placeEntries = [];
let markers = {};
let activeId = null;

const map = L.map('map', { zoomControl: false }).setView([37.9720, 23.7250], 14);
L.control.zoom({ position: 'topright' }).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OSM &copy; CARTO'
}).addTo(map);

const entriesList = document.getElementById('entriesList');
const entryCount = document.getElementById('entryCount');
const detailOverlay = document.getElementById('detailOverlay');
const detailContent = document.getElementById('detailContent');
const loading = document.getElementById('loading');

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  ユーティリティ
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function formatDate(isoStr) {
    if (!isoStr) return "";
    const d = new Date(isoStr);
    const m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return d.getDate() + ' ' + m[d.getMonth()] + ' ' + d.getFullYear();
}

function makeIcon(id) {
    return L.divIcon({
        className: '',
        html: `<div class="pin" data-id="${id}"></div>`,
        iconSize: [13, 13], iconAnchor: [6, 6]
    });
}

function clearMarkers() {
    Object.keys(markers).forEach(k => map.removeLayer(markers[k]));
    markers = {};
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  マークダウン・パーサー
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function parseMarkdown(text) {
    const lines = text.split('\n');
    const entries = [];
    let currentDateStr = "";
    let currentEntry = null;

    for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();
        if (!line) continue;

        // 日付の検出 (例: 20.02.2026)
        const dateMatch = line.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
        if (dateMatch) {
            currentDateStr = `${dateMatch[3]}-${dateMatch[2]}-${dateMatch[1]}`; // YYYY-MM-DD
            continue;
        }

        // 区切り線のスキップ
        if (line.includes('. . . .')) continue;

        // 場所と座標のペアを検出
        let nextLine = (lines[i+1] || "").trim();
        const coordMatch = nextLine.match(/^(-?\d+\.\d+),\s*(-?\d+\.\d+)$/);

        if (coordMatch) {
            const placeName = line;
            const lat = parseFloat(coordMatch[1]);
            const lng = parseFloat(coordMatch[2]);
            i++; // 座標行をスキップ

            currentEntry = {
                id: 'e' + entries.length,
                date: currentDateStr,
                place: placeName,
                title: placeName, // 初期タイトル
                lat: lat,
                lng: lng,
                body: ""
            };
            entries.push(currentEntry);
        } else if (currentEntry) {
            // 本文の蓄積
            currentEntry.body += line + "\n";
        }
    }

    // 本文の最初の1行をタイトルとして抽出する試み (日本語などの場合)
    entries.forEach(e => {
        const firstLine = e.body.trim().split('\n')[0];
        if (firstLine && firstLine.length < 50) {
            e.title = firstLine;
        }
    });

    return entries;
}

function generatePlaceEntries(entries) {
    const groups = {};
    entries.forEach(e => {
        const key = `${e.lat},${e.lng}`;
        if (!groups[key]) {
            groups[key] = {
                id: 'p' + Object.keys(groups).length,
                title: e.place,
                lat: e.lat, lng: e.lng,
                visits: []
            };
        }
        groups[key].visits.push({
            date: e.date,
            body: e.body,
            title: e.title,
            id: e.id
        });
    });
    return Object.values(groups);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  データフェッチ
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
async function loadData(lang) {
    loading.style.opacity = "1";
    loading.style.display = "flex";
    
    try {
        const response = await fetch(`${RAW_BASE_URL}athens_diary_${lang}.md`);
        if (!response.ok) throw new Error("Fetch failed");
        const text = await response.text();
        
        dateEntries = parseMarkdown(text);
        placeEntries = generatePlaceEntries(dateEntries);
        
        render();
        
        setTimeout(() => {
            loading.style.opacity = "0";
            setTimeout(() => loading.style.display = "none", 500);
        }, 300);

    } catch (err) {
        console.error(err);
        document.getElementById('currentStatus').textContent = "ERROR LOADING DATA";
    }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  描画ロジック
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function setActive(id) {
    activeId = id;
    document.querySelectorAll('.entry').forEach(el => {
        el.classList.toggle('active', el.getAttribute('data-id') === id);
    });
    
    // 地図上のピンを強調
    Object.keys(markers).forEach(mId => {
        const marker = markers[mId];
        const el = marker.getElement();
        if (el) {
            const pin = el.querySelector('.pin');
            if (pin) {
                // PLACEモードの場合は場所ID、DATEモードの場合はエントリIDで判定
                const isMatch = (mId === id);
                pin.classList.toggle('highlight', isMatch);
            }
        }
    });

    // サイドバーの対象までスクロール
    const activeEl = document.querySelector(`.entry[data-id="${id}"]`);
    if (activeEl) {
        activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
}

function showDetail(title, dateStr, bodyText) {
    const paragraphs = bodyText.split('\n').filter(p => p.trim());
    let bodyHtml = "";
    paragraphs.forEach(p => bodyHtml += `<p>${p}</p>`);

    detailContent.innerHTML = `
        <div class="detail-date">${dateStr}</div>
        <div class="detail-title">${title}</div>
        <div class="detail-body">${bodyHtml}</div>
    `;
    detailOverlay.classList.add('open');
}

function render() {
    clearMarkers();
    entriesList.innerHTML = '';
    detailOverlay.classList.remove('open');
    activeId = null;

    if (currentMode === 'date') {
        entryCount.textContent = `${dateEntries.length} entries`;
        dateEntries.forEach(entry => {
            // Marker
            const popupContent = `
                <div class="popup-date">${formatDate(entry.date)}</div>
                <div class="popup-title">${entry.place}</div>
            `;
            const marker = L.marker([entry.lat, entry.lng], { icon: makeIcon(entry.id) })
                .addTo(map).bindPopup(popupContent);
            
            // ピンをクリックした際の動作
            marker.on('click', (e) => {
                setActive(entry.id);
                showDetail(entry.title, formatDate(entry.date), entry.body);
            });
            
            markers[entry.id] = marker;

            // Sidebar
            const el = document.createElement('div');
            el.className = 'entry';
            el.setAttribute('data-id', entry.id);
            el.innerHTML = `
                <div class="entry-date">${formatDate(entry.date)} <span class="tag">${entry.place}</span></div>
                <div class="entry-title">${entry.title}</div>
                <div class="entry-excerpt">${entry.body.substring(0, 100)}...</div>
            `;
            el.onclick = () => {
                map.flyTo([entry.lat, entry.lng], 15, { duration: 0.8 });
                setActive(entry.id);
                showDetail(entry.title, formatDate(entry.date), entry.body);
            };
            entriesList.appendChild(el);
        });
    } else {
        entryCount.textContent = `${placeEntries.length} places`;
        placeEntries.forEach(place => {
            // Marker
            const marker = L.marker([place.lat, place.lng], { icon: makeIcon(place.id) })
                .addTo(map).bindPopup(`<div class="popup-title">${place.title}</div><div class="popup-body">${place.visits.length} visits</div>`);
            
            // ピンをクリックした際の動作 (場所モードではリストを強調)
            marker.on('click', () => {
                setActive(place.id);
            });
            
            markers[place.id] = marker;

            // Sidebar
            const el = document.createElement('div');
            el.className = 'entry';
            el.setAttribute('data-id', place.id);
            el.innerHTML = `
                <div class="entry-date">${place.visits.length} visits</div>
                <div class="entry-title">${place.title}</div>
            `;
            el.onclick = () => {
                map.flyTo([place.lat, place.lng], 15, { duration: 0.8 });
                setActive(place.id);
            };
            entriesList.appendChild(el);

            // Sub-visits
            place.visits.forEach(v => {
                const sub = document.createElement('div');
                sub.className = 'sub-entry';
                sub.innerHTML = `
                    <div class="sub-date">${formatDate(v.date)}</div>
                    <div class="sub-excerpt">${v.body.substring(0, 80)}...</div>
                `;
                sub.onclick = (e) => {
                    e.stopPropagation();
                    map.flyTo([place.lat, place.lng], 15, { duration: 0.8 });
                    setActive(place.id);
                    showDetail(place.title || v.title, formatDate(v.date), v.body);
                };
                entriesList.appendChild(sub);
            });
        });
    }
    
    map.setView([37.9720, 23.7250], 14);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  イベントリスナー
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
document.getElementById('langToggle').addEventListener('click', e => {
    const btn = e.target.closest('.toggle-btn');
    if (!btn) return;
    const lang = btn.getAttribute('data-lang');
    if (lang === currentLang) return;

    currentLang = lang;
    document.querySelectorAll('#langToggle .toggle-btn').forEach(b => b.classList.toggle('active', b === btn));
    loadData(currentLang);
});

document.getElementById('modeToggle').addEventListener('click', e => {
    const btn = e.target.closest('.toggle-btn');
    if (!btn) return;
    const mode = btn.getAttribute('data-mode');
    if (mode === currentMode) return;

    currentMode = mode;
    document.querySelectorAll('#modeToggle .toggle-btn').forEach(b => b.classList.toggle('active', b === btn));
    render();
});

document.getElementById('detailBack').addEventListener('click', () => {
    detailOverlay.classList.remove('open');
});

// ━━ 初期化 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
loadData(currentLang);

</script>
</body>
</html>
