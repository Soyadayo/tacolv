<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athens Diary</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Sans+JP:wght@300;400;500&family=DM+Mono:wght@300;400&display=swap');

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #f5f0e8;
            --bg-panel: #faf7f2;
            --text: #2c2a26;
            --text-muted: #8a857a;
            --accent: #c45a3c;
            --border: #ddd6c9;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 300;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        .header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            padding: 16px 28px 14px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-panel);
        }
        .header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 300;
            font-size: 26px;
            letter-spacing: 0.02em;
        }
        .header h1 em { font-style: italic; color: var(--accent); }
        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .header .subtitle {
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            font-weight: 300;
            color: var(--text-muted);
            letter-spacing: 0.06em;
        }

        .mode-toggle {
            display: flex;
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
        }
        .mode-btn {
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.04em;
            padding: 5px 12px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }
        .mode-btn.active {
            background: var(--text);
            color: var(--bg);
        }

        .main { display: flex; height: calc(100vh - 56px); }

        .sidebar {
            width: 380px; min-width: 380px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column;
            position: relative; overflow: hidden;
        }
        .sidebar-top {
            padding: 14px 22px 10px;
            border-bottom: 1px solid var(--border);
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            color: var(--text-muted);
        }
        .entries { flex: 1; overflow-y: auto; padding: 4px 0; }
        .entries::-webkit-scrollbar { width: 4px; }
        .entries::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .entry {
            padding: 14px 22px;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }
        .entry:hover { background: rgba(196,90,60,0.04); }
        .entry.active {
            background: rgba(196,90,60,0.07);
            border-left-color: var(--accent);
        }
        .entry-date {
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
            display: flex; align-items: center; gap: 8px;
        }
        .entry-date .tag {
            font-size: 9px;
            padding: 1px 7px;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-muted);
        }
        .entry-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 18px;
            font-weight: 400;
            line-height: 1.3;
            margin-bottom: 6px;
        }
        .entry-excerpt {
            font-size: 12.5px;
            line-height: 1.7;
            color: var(--text-muted);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* sub-entries for place mode */
        .sub-entry {
            padding: 10px 22px 10px 34px;
            cursor: pointer;
            transition: all 0.15s;
            border-left: 3px solid transparent;
        }
        .sub-entry:hover { background: rgba(196,90,60,0.03); }
        .sub-entry .sub-date {
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            color: var(--text-muted);
            margin-bottom: 3px;
        }
        .sub-entry .sub-excerpt {
            font-size: 12px;
            line-height: 1.6;
            color: var(--text-muted);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .detail-overlay {
            position: absolute; inset: 0;
            background: var(--bg-panel);
            z-index: 10;
            overflow-y: auto;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
        }
        .detail-overlay.open { transform: translateX(0); }
        .detail-back {
            display: block;
            padding: 14px 22px;
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            color: var(--text-muted);
            cursor: pointer;
            border: none; background: none;
        }
        .detail-back:hover { color: var(--text); }
        .detail-content { padding: 0 22px 40px; }
        .detail-date {
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .detail-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 24px;
            font-weight: 400;
            line-height: 1.35;
            margin-bottom: 18px;
        }
        .detail-body { font-size: 13.5px; line-height: 2; color: #4a4740; }
        .detail-body p { margin-bottom: 0.8em; }

        .map-wrap { flex: 1; }
        #map { height: 100%; width: 100%; }

        .pin {
            width: 13px; height: 13px;
            background: var(--accent);
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(196,90,60,0.35);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .pin.highlight {
            transform: scale(1.6);
            box-shadow: 0 2px 14px rgba(196,90,60,0.55);
        }

        .leaflet-popup-content-wrapper {
            border-radius: 4px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
            font-family: 'Noto Sans JP', sans-serif;
        }
        .leaflet-popup-content { margin: 14px 16px; font-size: 13px; line-height: 1.6; }
        .popup-date { font-family: 'DM Mono', monospace; font-size: 10px; color: #8a857a; margin-bottom: 3px; }
        .popup-title { font-family: 'Cormorant Garamond', serif; font-size: 17px; margin-bottom: 6px; }
        .popup-body { color: #5a5750; font-weight: 300; font-size: 12.5px; }

        @media (max-width: 800px) {
            .main { flex-direction: column-reverse; }
            .sidebar { width: 100%; min-width: unset; height: 45vh; border-right: none; border-top: 1px solid var(--border); }
            .map-wrap { height: 55vh; }
            .header { flex-wrap: wrap; gap: 8px; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1><em>Athens</em> Diary</h1>
    <div class="header-right">
        <div class="mode-toggle">
            <button class="mode-btn active" data-mode="date">日付</button>
            <button class="mode-btn" data-mode="place">場所</button>
        </div>
        <span class="subtitle">Αθήνα 2026</span>
    </div>
</div>

<div class="main">
    <div class="sidebar">
        <div class="sidebar-top" id="entryCount"></div>
        <div class="entries" id="entriesList"></div>
        <div class="detail-overlay" id="detailOverlay">
            <button class="detail-back" id="detailBack">← もどる</button>
            <div class="detail-content" id="detailContent"></div>
        </div>
    </div>
    <div class="map-wrap">
        <div id="map"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  日記データ（日付軸）
//  place: 代表的な場所名, lat/lng: その座標
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
var dateEntries = [
    {
        id: "d01",
        date: "2026-02-20",
        title: "到着、土砂降り、方丈記",
        place: "アテネ中心部（バス降車地点）",
        lat: 37.9755, lng: 23.7348,
        body: "デュッセルドルフからフランクフルトを経由して、アテネについた。最初の飛行機の遅延によって、乗り継ぎ時間が５分しかなかったのはご愛敬として、無事にアテネに。エクスプレスバスのチケットを買い、バス停へ。そこで出会ったカナダ人の夫婦と、1時間ずっと話をしていた。僕がカナダに本社がある会社に働いていたこと、彼らは日本人の留学生の受け入れをしていたこと、はじめてのギリシャ、様々な旅の話、インフレの話。\n\nバスを降りると土砂降りの雨、そして風も強い。フランクフルトからアテネに向かう飛行機の中で読んだ「方丈記」のことを考える。世の中の移り変わりに関して述べられていたことは、今僕が感じていることと全く同じだった。毎年自分の状況もかわり、世界情勢もかわっている。そんなことを、強風にあおられ、傘をさすのをあきらめて、土砂降りを体に浴びながら考えていた。"
    },
    {
        id: "d02",
        date: "2026-02-21",
        title: "ジャズ、批評性、二つのオープニング",
        place: "シンタグマ広場付近",
        lat: 37.9762, lng: 23.7310,
        body: "昨日は、レジデンス施設に到着した後にバーを二軒ハシゴした。一軒目はギリシャのビール、二軒目は偶然にもジャズのコンサート。歌唱技術はある程度高いように想えたが、何か肝心なものが抜けている気がして、演奏としてはひどい演奏に思えてしまった。途中の休憩にCDから流されるジャズの名手たちの音源が強くこころを引く。目の前でやっているライブであっても、現場においてCDに負けてしまう状態はとても残酷に思えた。\n\n今日は昼頃にPaoloと奥さんが来て、プログラムについて話をした。僕の住んでいる街でローストされたコーヒーを渡した。とても喜んでくれていてよかった。\n\nその後、二つのオープニングに行く。奇しくも二つの展覧会場ではそれぞれパフォーマンスも行われた。批評的になってしまう癖がここでも出てきてしまった。アクティブな場所にはアクティブな人間が集まっている。"
    },
    {
        id: "d03",
        date: "2026-02-22",
        title: "市場、イカ、衝撃のギュロス未遂",
        place: "ヴァルヴァキオス市場",
        lat: 37.9810, lng: 23.7280,
        body: "少し遅めに起動。急にやるべきことが見つかった気がして、部屋の中を意味なくうろうろしてしまう。うろうろしながら考えが少しまとまって来たので、外に出た。気の向くままに歩いていたら、市場にたどり着いた。入った瞬間魚介類がたくさんあり、夢のように感じた。僕が住むドイツには、魚市場的な場所は少なくとも近くには無い。イカを二杯購入。「店の人にこれだけか？」と聞かれる。\n\nヴァシリスから、２月２３日は、パンに、魚の卵のソースをつけて食べるのだと聞いた。そのソースを見つけ購入。\n\n去年アテネに来た時に食べたギュロスを食べに向かう。たどり着いたが、ギュロスは無い。あのギュロスはドイツに帰ってから何度も人にいうくらい衝撃のおいしさだった。\n\n帰ってイカを醤油で煮込んで食べる。最高においしい。ギリシャのイカに、日本の憧憬を重ね、ドイツで新鮮なおいしいイカが食べられない事への反動で、とてもおいしくいただく。"
    },
    {
        id: "d04",
        date: "2026-02-23",
        title: "凧あげ、地元の祭りの記憶",
        place: "フィロパポスの丘",
        lat: 37.9673, lng: 23.7213,
        body: "今日は祝日だ。断食の初日であり、みんな魚を食べるという日。特別なパンを買いに出る。パン屋に入ると一区画が大きくて、ゴマがたくさんついたパンで埋め尽くされていた。どう考えてもこのパンだと思ったので、購入。魚卵のクリームをつけて食べたが、とてもおいしい。\n\n凧あげをしているという丘に向かう。Philopapposの丘。去年の１０月から足腰を中心に鍛えているが、この急な坂道で息切れひとつしていないので、その効果を実感した。\n\n日本の地元の凧まつりのことを考える。約１０平方メートルほどの凧を地域ごとにあげ、それをぶつけて糸を切り合うという少し荒っぽい祭り。一年で一番楽しみな祭りだった。\n\n丘の上に着くと、凧をあげるため、そしてその様子をみにくるために、たくさんの人がいた。僕も少し人が少ない場所を見つけて、すべすべの石に座る。頭には何も浮かんで来なかった。ただ、その場所にいることを楽しんだ。"
    },
    {
        id: "d05",
        date: "2026-02-24",
        title: "展覧会、家という財産、貝ごはん",
        place: "大学ギャラリー付近",
        lat: 37.9770, lng: 23.7360,
        body: "朝から昼過ぎまで、別のプロジェクトの準備やメールの返事をしたり、書類を作ったりしていたら過ぎてしまった。貝でパスタを作って食べる。とてもおいしい。\n\nヴァシリスが誘ってくれた展覧会へ。アメリカにある大学のギリシャ校であり、そのイベントスペースでの展覧会。展覧会自体もよかったが、その大学の持つギリシャのアーティストのコレクションにとても惹かれた。\n\n僕と同じ日に別のレジデンスに来たという人とも出会いいろいろ話をした。美術、仕事、老い、若さなどいろいろな話をしながら、近くのバーに流れ楽しく時間を過ごす。家という財産について話をすることがあった。日本で家や土地を引き継ぐことになったことにより、少し考えていたところだった。\n\nスタジオに帰ったら、急に貝と米を一緒に炊くことを思いついてしまい、めちゃくちゃ眠いがそれを作ってしまった。一口たべて寝る。"
    },
    {
        id: "d06",
        date: "2026-02-25",
        title: "市場ふたたび、イカの内臓",
        place: "ヴァルヴァキオス市場",
        lat: 37.9815, lng: 23.7275,
        body: "朝から書き仕事をし、歌を歌うパフォーマンスをするので、６階の部屋で少し声を出す。\n\nAlpha銀行についたが、なぞのドアがあり、どうやって中に入るかわからない。外のATMで現金を引き出す。\n\n市場に向かう。前回は魚を食べる日の前日だったので、とんでもない賑わいだった。今回は人も少なく、魚の数も少なかった。前回はイカをさばいてはくれなかったが、今回は待ってろと言われ、内臓をとった状態のイカを渡してくれた。\n\n外の野菜売り場で、ニンニク、マッシュルーム、キャベツを買う。"
    },
    {
        id: "d07",
        date: "2026-02-26",
        title: "紙テープ、方向性への危機感",
        place: "スタジオ",
        lat: 37.9745, lng: 23.7265,
        body: "２１日に展覧会に出掛けたときに思い付いた紙テープを使った作品を作りはじめるが、方向性がこれでいいのかよくわからなくなってしまった。単なるランダムな創作欲の発露になってしまいそうだと危機感を憶える。"
    },
    {
        id: "d08",
        date: "2026-02-27",
        title: "洗濯屋の笑顔、理想のギュロス、至福のビール",
        place: "展覧会場周辺",
        lat: 37.9790, lng: 23.7220,
        body: "書き仕事をしたのち、ドローイングを書く。洗濯をしに行く。３時間後に戻ってこいとのことで、洗濯から乾燥までしてくれる。洗濯物はきれいにたたまれていた。店主の笑顔に救われた気持ちになる。\n\n地元の小さなレストランに狙いを決めて入ったが、席はあるのにだめだと言われた。言い訳がころころ変わっているので、完全に嘘だとわかった。まあ、嘘をついてくれただけよいと思うことにした。\n\n会場周辺で完全に理想の店をみつけ、牛と豚のギュロスを食べる。二つ食べても、もう少し食べたいと思うくらい食欲が触発される。近くのビールバーで飲む。至福の時間。\n\n展覧会へ。去年の滞在で出会った人とも合う。DJの音楽とともにバーで飲む。今日はたくさん飲み、人としゃべった日だった。"
    },
    {
        id: "d09",
        date: "2026-02-28",
        title: "締め切り、別のレジデンス、屋上から海",
        place: "財団の建物（屋上）",
        lat: 37.9398, lng: 23.6920,
        body: "昨日の酒がまだ残っているが、仕事をはじめる。外にでてコーヒーを買い、スタジオに戻る。１３時半ごろに締め切りのあったものの提出を終え、少し一息。\n\nヴァシリスと出掛ける。坂道を昇り、野菜マーケットを通りすぎると、別のレジデンス施設があった。展示を見終わって、ヴァシリスのスタジオとスペースに向かう。\n\nある財団が運営する巨大な建物へ。図書館、コンサート会場などが併設された建物。ポンピドゥーセンターの設計者でもあるらしい。アートへの支援も行っており、なによりこんな素晴らしい施設がパブリックにすべての人が使えるようになっているのが素晴らしい。\n\n屋上に出て、大きな空気の流れを感じる。海が見える。アクロポリスが見える。海運産業の話をする。"
    }
];

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  場所データ（場所軸）
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
var placeEntries = [
    {
        id: "p01",
        title: "シンタグマ広場 / バス降車地点",
        lat: 37.9755, lng: 23.7348,
        visits: [
            { date: "2026-02-20", body: "エクスプレスバスを降りた場所。土砂降りの雨。カナダ人夫婦との1時間の会話。方丈記のことを考えながら、傘をさすのをあきらめて歩いた。" },
            { date: "2026-02-21", body: "バーを二軒ハシゴ。ジャズのコンサートを聴く。CDに負けてしまうライブの残酷さ。" }

    {

        visits: [
            { date: "2026-02-22", body: "気の向くままに歩いていたらたどり着いた。入った瞬間、魚介類がたくさんあり夢のように感じた。イカを二杯購入。「これだけか？」と聞かれる。魚卵のソースも見つけて購入。" },
            { date: "2026-02-25", body: "前回より人も魚も少ない。今回はイカの内臓をとってくれた。外の野菜売り場でニンニク、マッシュルーム、キャベツを買う。" }
        ]
    },
    {
        id: "p03",
        title: "フィロパポスの丘",

        visits: [

        ]
    },
    {
        id: "p04",
        title: "スタジオ / レジデンス",

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
var currentMode = "date";
var activeId = null;
var markers = {};

function formatDate(s) {
    var d = new Date(s);
    var m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return d.getDate() + ' ' + m[d.getMonth()] + ' ' + d.getFullYear();
}

// ━━ Map ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
var map = L.map('map', { zoomControl: false }).setView([37.9720, 23.7250], 14);
L.control.zoom({ position: 'topright' }).addTo(map);

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OSM &copy; CARTO', maxZoom: 19
}).addTo(map);

// ━━ Rendering ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
var entriesList = document.getElementById('entriesList');
var entryCount = document.getElementById('entryCount');
var detailOverlay = document.getElementById('detailOverlay');
var detailContent = document.getElementById('detailContent');

function clearMarkers() {
    Object.keys(markers).forEach(function(k) { map.removeLayer(markers[k]); });
    markers = {};
}

function makeIcon(id) {
    return L.divIcon({
        className: '',
        html: '<div class="pin" data-id="' + id + '"></div>',
        iconSize: [13, 13], iconAnchor: [6, 6]
    });
}

function setActive(id) {
    activeId = id;
    document.querySelectorAll('.entry').forEach(function(el) {
        el.classList.toggle('active', el.getAttribute('data-id') === id);
    });
    Object.keys(markers).forEach(function(mId) {
        try {
            var el = markers[mId].getElement();
            if (el) {
                var dot = el.querySelector('.pin');
                if (dot) dot.classList.toggle('highlight', mId === id);
            }
        } catch(e) {}
    });
    var activeEl = document.querySelector('.entry[data-id="' + id + '"]');
    if (activeEl) activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function flyTo(id, lat, lng) {
    map.flyTo([lat, lng], 15, { duration: 0.7 });
    map.once('moveend', function() {
        if (markers[id]) markers[id].openPopup();
    });
    setActive(id);
}

function showDetail(title, dateStr, bodyText) {
    var parts = bodyText.split('\n').filter(function(p) { return p.trim(); });
    var bodyHtml = '';
    parts.forEach(function(p) { bodyHtml += '<p>' + p + '</p>'; });

    detailContent.innerHTML =
        '<div class="detail-date">' + dateStr + '</div>' +
        '<div class="detail-title">' + title + '</div>' +
        '<div class="detail-body">' + bodyHtml + '</div>';
    detailOverlay.classList.add('open');
}

document.getElementById('detailBack').addEventListener('click', function() {
    detailOverlay.classList.remove('open');
});

// ━━ Date Mode ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function renderDateMode() {
    clearMarkers();
    entriesList.innerHTML = '';
    detailOverlay.classList.remove('open');
    activeId = null;
    entryCount.textContent = dateEntries.length + ' days';

    dateEntries.forEach(function(entry) {
        // marker
        var popup = '<div class="popup-date">' + formatDate(entry.date) + '</div>' +
            '<div class="popup-title">' + entry.title + '</div>' +
            '<div class="popup-body">' + entry.body.split('\n')[0].substring(0, 80) + '…</div>';

        var marker = L.marker([entry.lat, entry.lng], { icon: makeIcon(entry.id) })
            .addTo(map).bindPopup(popup, { maxWidth: 250 });
        marker.on('click', function() { setActive(entry.id); });
        markers[entry.id] = marker;

        // sidebar
        var el = document.createElement('div');
        el.className = 'entry';
        el.setAttribute('data-id', entry.id);
        el.innerHTML =
            '<div class="entry-date">' + formatDate(entry.date) +
            '<span class="tag">' + entry.place + '</span></div>' +
            '<div class="entry-title">' + entry.title + '</div>' +
            '<div class="entry-excerpt">' + entry.body.replace(/\n/g, ' ') + '</div>';

        el.addEventListener('click', function() {
            flyTo(entry.id, entry.lat, entry.lng);
            showDetail(entry.title, formatDate(entry.date), entry.body);
        });
        entriesList.appendChild(el);
    });

    map.setView([37.9720, 23.7250], 14);
}

// ━━ Place Mode ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function renderPlaceMode() {
    clearMarkers();
    entriesList.innerHTML = '';
    detailOverlay.classList.remove('open');
    activeId = null;
    entryCount.textContent = placeEntries.length + ' places';

    placeEntries.forEach(function(place) {
        var firstVisit = place.visits[0];
        var popup = '<div class="popup-title">' + place.title + '</div>' +
            '<div class="popup-body">' + place.visits.length + ' visits</div>';

        var marker = L.marker([place.lat, place.lng], { icon: makeIcon(place.id) })
            .addTo(map).bindPopup(popup, { maxWidth: 220 });
        marker.on('click', function() { setActive(place.id); });
        markers[place.id] = marker;

        // sidebar - place header
        var el = document.createElement('div');
        el.className = 'entry';
        el.setAttribute('data-id', place.id);
        el.innerHTML =
            '<div class="entry-date">' + place.visits.length + ' visits</div>' +
            '<div class="entry-title">' + place.title + '</div>';

        el.addEventListener('click', function() {
            flyTo(place.id, place.lat, place.lng);
        });
        entriesList.appendChild(el);

        // sub-entries per visit
        place.visits.forEach(function(v, i) {
            var sub = document.createElement('div');
            sub.className = 'sub-entry';
            sub.innerHTML =
                '<div class="sub-date">' + formatDate(v.date) + '</div>' +
                '<div class="sub-excerpt">' + v.body.replace(/\n/g, ' ') + '</div>';
            sub.addEventListener('click', function(e) {
                e.stopPropagation();
                flyTo(place.id, place.lat, place.lng);
                showDetail(place.title, formatDate(v.date), v.body);
            });
            entriesList.appendChild(sub);
        });
    });

    map.setView([37.9720, 23.7250], 14);
}

// ━━ Mode Toggle ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
document.querySelectorAll('.mode-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
        var mode = btn.getAttribute('data-mode');
        if (mode === currentMode) return;
        currentMode = mode;
        document.querySelectorAll('.mode-btn').forEach(function(b) {
            b.classList.toggle('active', b.getAttribute('data-mode') === mode);
        });
        if (mode === 'date') renderDateMode();
        else renderPlaceMode();
    });
});

// ━━ Init ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
renderDateMode();
</script>
