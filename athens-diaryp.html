<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Athens Diary</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Sans+JP:wght@300;400;500&family=DM+Mono:wght@300;400&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f5f0e8;--bg-panel:#faf7f2;--text:#2c2a26;--text-muted:#8a857a;--accent:#c45a3c;--accent-blue:#3b7fc4;--border:#ddd6c9}
body{font-family:'Noto Sans JP',sans-serif;font-weight:300;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
#loading{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;justify-content:center;align-items:center;font-family:'DM Mono',monospace;font-size:12px;color:var(--accent);transition:opacity 0.5s}

/* ===== HEADER ===== */
.header{display:flex;align-items:center;padding:12px 28px;border-bottom:1px solid var(--border);background:var(--bg-panel);z-index:100;gap:16px}
.header h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:26px;letter-spacing:0.02em;white-space:nowrap}
.header h1 em{font-style:italic;color:var(--accent)}

/* Source toggle (MEMORY/FESTIVAL) - centered in remaining space */
.header-center{flex:1;display:flex;justify-content:center}
#sourceToggle{display:flex;border:1px solid var(--accent);border-radius:20px;overflow:hidden;background:#fff}
#sourceToggle .toggle-btn{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:0.06em;padding:7px 20px;border:none;background:transparent;color:var(--text-muted);cursor:pointer;transition:all 0.2s;font-weight:400}
#sourceToggle .toggle-btn.active{background:var(--accent);color:#fff}

.header-controls{display:flex;align-items:center;gap:12px}
.toggle-group{display:flex;border:1px solid var(--border);border-radius:16px;overflow:hidden;background:#fff}
.toggle-btn{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.04em;padding:5px 12px;border:none;background:transparent;color:var(--text-muted);cursor:pointer;transition:all 0.2s}
.toggle-btn.active{background:var(--text);color:var(--bg)}
.home-link{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.04em;padding:5px 12px;border:1px solid var(--border);border-radius:16px;background:#fff;color:var(--text-muted);cursor:pointer;text-decoration:none;transition:all 0.2s;white-space:nowrap}
.home-link:hover{background:var(--text);color:var(--bg)}

/* ===== MAIN LAYOUT ===== */
.main{display:flex;height:calc(100vh - 56px)}
.sidebar{width:380px;min-width:380px;background:var(--bg-panel);border-right:1px solid var(--border);display:flex;flex-direction:column;position:relative;overflow:hidden}
.sidebar-top{padding:14px 22px 10px;border-bottom:1px solid var(--border);font-family:'DM Mono',monospace;font-size:11px;color:var(--text-muted);display:flex;justify-content:space-between}
.entries{flex:1;overflow-y:auto;padding:4px 0}
.entries::-webkit-scrollbar{width:4px}
.entries::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.entry{padding:14px 22px;cursor:pointer;transition:all 0.2s;border-left:3px solid transparent}
.entry:hover{background:rgba(196,90,60,0.04)}
.entry.active{background:rgba(196,90,60,0.07);border-left-color:var(--accent)}
.entry-date{font-family:'DM Mono',monospace;font-size:11px;color:var(--text-muted);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.entry-date .tag{font-size:9px;padding:1px 7px;border:1px solid var(--border);border-radius:10px;color:var(--text-muted);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry-title{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:400;line-height:1.3;margin-bottom:6px}
.entry-excerpt{font-size:12.5px;line-height:1.7;color:var(--text-muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sub-entry{padding:10px 22px 10px 34px;cursor:pointer;transition:all 0.15s;border-left:3px solid transparent}
.sub-entry:hover{background:rgba(196,90,60,0.03)}
.sub-entry .sub-date{font-family:'DM Mono',monospace;font-size:10px;color:var(--text-muted);margin-bottom:3px}
.sub-entry .sub-excerpt{font-size:12px;line-height:1.6;color:var(--text-muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ===== DETAIL OVERLAY - FIXED FOR MOBILE ===== */
.detail-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:var(--bg-panel);z-index:10;display:flex;flex-direction:column;transform:translateX(-100%);transition:transform 0.3s ease}
.detail-overlay.open{transform:translateX(0)}
.detail-back{display:block;flex-shrink:0;padding:14px 22px;font-family:'DM Mono',monospace;font-size:11px;color:var(--text-muted);cursor:pointer;border:none;background:none;border-bottom:1px solid var(--border);text-align:left}
.detail-back:hover{color:var(--text)}
.detail-content{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:14px 22px 120px}
.detail-content::-webkit-scrollbar{width:4px}
.detail-content::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.detail-date{font-family:'DM Mono',monospace;font-size:11px;color:var(--text-muted);margin-bottom:8px}
.detail-title{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:400;line-height:1.35;margin-bottom:18px}
.detail-body{font-size:13.5px;line-height:2;color:#4a4740}
.detail-body p{margin-bottom:0.8em}

/* ===== MAP ===== */
.map-wrap{flex:1;position:relative}
#map{height:100%;width:100%}
.pin{width:13px;height:13px;background:var(--accent);border:2px solid #fff;border-radius:50%;box-shadow:0 2px 8px rgba(196,90,60,0.35);transition:transform 0.2s,box-shadow 0.2s,opacity 0.2s;cursor:pointer}
.pin.highlight{transform:scale(1.6);box-shadow:0 2px 14px rgba(196,90,60,0.55)}
.pin.blue{background:var(--accent-blue);box-shadow:0 2px 8px rgba(59,127,196,0.35)}
.pin.blue.highlight{transform:scale(1.6);box-shadow:0 2px 14px rgba(59,127,196,0.55)}
.pin.dim{opacity:0.35;transform:scale(0.8)}
.pin.dim.highlight{opacity:1;transform:scale(1.4)}
.leaflet-popup-content-wrapper{border-radius:4px;box-shadow:0 4px 20px rgba(0,0,0,0.12)}
.leaflet-popup-content{margin:14px 16px;font-size:13px;line-height:1.6}
.popup-date{font-family:'DM Mono',monospace;font-size:10px;color:#8a857a;margin-bottom:3px}
.popup-title{font-family:'Cormorant Garamond',serif;font-size:17px;margin-bottom:6px}
.popup-body{color:#5a5750;font-weight:300;font-size:12.5px}
.popup-src{font-family:'DM Mono',monospace;font-size:9px;color:#aaa;margin-top:4px}

/* ===== MOBILE ===== */
@media(max-width:800px){
.header{flex-wrap:wrap;padding:10px 16px;gap:8px}
.header h1{font-size:22px}
.header-center{order:10;flex-basis:100%;justify-content:center;margin-top:2px}
#sourceToggle .toggle-btn{font-size:13px;padding:8px 28px}
.header-controls{gap:8px}
.main{flex-direction:column-reverse}
.sidebar{width:100%;min-width:unset;height:45vh;border-right:none;border-top:1px solid var(--border)}
.map-wrap{height:55vh}
/* Mobile detail overlay uses fixed position to escape sidebar constraints */
.detail-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:200;padding-top:0}
.detail-content{padding:14px 22px 140px}
}
</style>
</head>
<body>
<div id="loading">FETCHING DATA...</div>
<div class="header">
<h1 id="pageTitle"><em>Athens</em> Diary</h1>
<div class="header-center">
<div class="toggle-group" id="sourceToggle">
<button class="toggle-btn active" data-source="diary">MEMORY</button>
<button class="toggle-btn" data-source="scenes">FESTIVAL</button>
</div>
</div>
<div class="header-controls">
<a href="https://www.tacolv.org" class="home-link">&#8592; TOP</a>
<div class="toggle-group" id="langToggle">
<button class="toggle-btn active" data-lang="jp">JP</button>
<button class="toggle-btn" data-lang="en">EN</button>
<button class="toggle-btn" data-lang="gr">GR</button>
</div>
<div class="toggle-group" id="modeToggle">
<button class="toggle-btn active" data-mode="date">DATE</button>
<button class="toggle-btn" data-mode="place">PLACE</button>
</div>
</div>
</div>
<div class="main">
<div class="sidebar">
<div class="sidebar-top">
<span id="entryCount">0 entries</span>
<span id="currentStatus" style="font-size:9px;opacity:0.6;"></span>
</div>
<div class="entries" id="entriesList"></div>
<div class="detail-overlay" id="detailOverlay">
<button class="detail-back" id="detailBack">&#8592; BACK</button>
<div class="detail-content" id="detailContent"></div>
</div>
</div>
<div class="map-wrap">
<div id="map"></div>
</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var RAW="https://raw.githubusercontent.com/Soyadayo/tacolv/main/";
var cLang="jp",cMode="date",cSrc="diary";
var allData={diary:{date:[],place:[]},scenes:{date:[],place:[]}};
var mrk={},bgMrk={},aId=null;
var SRC={
diary:{fp:"athens_diary_",t:"<em>Athens</em> Diary",pin:"",label:"MEMORY"},
scenes:{fp:"scenes_",t:"<em>Festival</em> Days",pin:"blue",label:"FESTIVAL"}
};
var otherSrc=function(s){return s==="diary"?"scenes":"diary";};
var mp=L.map('map',{zoomControl:false}).setView([37.9720,23.7250],14);
L.control.zoom({position:'topright'}).addTo(mp);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'&#169; OSM &#169; CARTO'}).addTo(mp);
var eL=document.getElementById('entriesList');
var eC=document.getElementById('entryCount');
var dO=document.getElementById('detailOverlay');
var dC=document.getElementById('detailContent');
var ld=document.getElementById('loading');
var pT=document.getElementById('pageTitle');

function fD(s){if(!s)return"";var d=new Date(s);var m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return d.getDate()+' '+m[d.getMonth()]+' '+d.getFullYear();}

function mkIcon(id,srcKey,dim){
var extra=SRC[srcKey].pin;
var cls="pin"+(extra?" "+extra:"")+(dim?" dim":"");
return L.divIcon({className:'',html:'<div class="'+cls+'" data-id="'+id+'"></div>',iconSize:[13,13],iconAnchor:[6,6]});
}

function clearAll(){
Object.keys(mrk).forEach(function(k){mp.removeLayer(mrk[k]);});mrk={};
Object.keys(bgMrk).forEach(function(k){mp.removeLayer(bgMrk[k]);});bgMrk={};
}

function pMD(text){
var lines=text.split('\n'),entries=[],cDS="",cE=null;
for(var i=0;i<lines.length;i++){
var l=lines[i].trim();if(!l)continue;
var dm=l.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
if(dm){cDS=dm[3]+'-'+dm[2]+'-'+dm[1];continue;}
if(l.indexOf('. . . .')!==-1)continue;
var nl=(lines[i+1]||"").trim();
var cm=nl.match(/^(-?\d+\.\d+),\s*(-?\d+\.\d+)$/);
if(cm){i++;cE={id:'e'+entries.length,date:cDS,place:l,title:l,lat:parseFloat(cm[1]),lng:parseFloat(cm[2]),body:""};entries.push(cE);}
else if(cE){cE.body+=l+"\n";}
}
entries.forEach(function(e){var fl=e.body.trim().split('\n')[0];if(fl&&fl.length<50)e.title=fl;});
return entries;
}

function gPE(entries){
var g={};
entries.forEach(function(e){var k=e.lat+','+e.lng;if(!g[k])g[k]={id:'p'+Object.keys(g).length,title:e.place,lat:e.lat,lng:e.lng,visits:[]};g[k].visits.push({date:e.date,body:e.body,title:e.title,id:e.id});});
return Object.values(g);
}

function fetchSrc(srcKey,lang){
return fetch(RAW+SRC[srcKey].fp+lang+'.md').then(function(r){
if(!r.ok)throw new Error("fail");return r.text();
}).then(function(t){
var de=pMD(t);
allData[srcKey]={date:de,place:gPE(de)};
});
}

function loadAll(lang){
ld.style.opacity="1";ld.style.display="flex";
Promise.all([fetchSrc('diary',lang),fetchSrc('scenes',lang)]).then(function(){
render();
setTimeout(function(){ld.style.opacity="0";setTimeout(function(){ld.style.display="none";},500);},300);
}).catch(function(err){
console.error(err);
document.getElementById('currentStatus').textContent="ERROR LOADING DATA";
ld.style.opacity="0";
setTimeout(function(){ld.style.display="none";},500);
});
}

function setActive(id){
aId=id;
document.querySelectorAll('.entry').forEach(function(el){el.classList.toggle('active',el.getAttribute('data-id')===id);});
Object.keys(mrk).forEach(function(mId){var m=mrk[mId];var el=m.getElement();if(el){var p=el.querySelector('.pin');if(p)p.classList.toggle('highlight',mId===id);}});
var ae=document.querySelector('.entry[data-id="'+id+'"]');if(ae)ae.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function showDetail(title,dateStr,bodyText){
var ps=bodyText.split('\n').filter(function(p){return p.trim();});
var h="";ps.forEach(function(p){h+='<p>'+p+'</p>';});
dC.innerHTML='<div class="detail-date">'+dateStr+'</div><div class="detail-title">'+title+'</div><div class="detail-body">'+h+'</div>';
dO.classList.add('open');dC.scrollTop=0;
}

function addBgPins(srcKey){
var other=otherSrc(srcKey);
var bgDate=allData[other].date;
if(!bgDate||!bgDate.length)return;
var seen={};
bgDate.forEach(function(entry){
var k=entry.lat+','+entry.lng;
if(seen[k])return;seen[k]=true;
var bid='bg_'+entry.id;
var m=L.marker([entry.lat,entry.lng],{icon:mkIcon(bid,other,true),zIndexOffset:-1000}).addTo(mp);
m.bindPopup('<div class="popup-title">'+entry.place+'</div><div class="popup-src">'+SRC[other].label+'</div>');
m.on('click',function(){
cSrc=other;
document.querySelectorAll('#sourceToggle .toggle-btn').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-source')===other);});
pT.innerHTML=SRC[other].t;
render();
});
bgMrk[bid]=m;
});
}

function render(){
clearAll();eL.innerHTML='';dO.classList.remove('open');aId=null;
pT.innerHTML=SRC[cSrc].t;
var dEnt=allData[cSrc].date;
var pEnt=allData[cSrc].place;

addBgPins(cSrc);

if(cMode==='date'){
eC.textContent=dEnt.length+' entries';
dEnt.forEach(function(entry){
var pc='<div class="popup-date">'+fD(entry.date)+'</div><div class="popup-title">'+entry.place+'</div>';
var m=L.marker([entry.lat,entry.lng],{icon:mkIcon(entry.id,cSrc,false)}).addTo(mp).bindPopup(pc);
m.on('click',function(){setActive(entry.id);showDetail(entry.title,fD(entry.date),entry.body);});
mrk[entry.id]=m;
var el=document.createElement('div');el.className='entry';el.setAttribute('data-id',entry.id);
el.innerHTML='<div class="entry-date">'+fD(entry.date)+' <span class="tag">'+entry.place+'</span></div><div class="entry-title">'+entry.title+'</div><div class="entry-excerpt">'+entry.body.substring(0,100)+'...</div>';
el.onclick=function(){mp.flyTo([entry.lat,entry.lng],15,{duration:0.8});setActive(entry.id);showDetail(entry.title,fD(entry.date),entry.body);};
eL.appendChild(el);
});
}else{
eC.textContent=pEnt.length+' places';
pEnt.forEach(function(place){
var m=L.marker([place.lat,place.lng],{icon:mkIcon(place.id,cSrc,false)}).addTo(mp).bindPopup('<div class="popup-title">'+place.title+'</div><div class="popup-body">'+place.visits.length+' visits</div>');
m.on('click',function(){
setActive(place.id);
var ab=place.visits.map(function(v){return'\u2500\u2500 '+fD(v.date)+' \u2500\u2500\n'+v.body;}).join('\n');
showDetail(place.title,place.visits.length+' visits',ab);
});
mrk[place.id]=m;
var el=document.createElement('div');el.className='entry';el.setAttribute('data-id',place.id);
el.innerHTML='<div class="entry-date">'+place.visits.length+' visits</div><div class="entry-title">'+place.title+'</div>';
el.onclick=function(){
mp.flyTo([place.lat,place.lng],15,{duration:0.8});setActive(place.id);
var ab=place.visits.map(function(v){return'\u2500\u2500 '+fD(v.date)+' \u2500\u2500\n'+v.body;}).join('\n');
showDetail(place.title,place.visits.length+' visits',ab);
};
eL.appendChild(el);
place.visits.forEach(function(v){
var sub=document.createElement('div');sub.className='sub-entry';
sub.innerHTML='<div class="sub-date">'+fD(v.date)+'</div><div class="sub-excerpt">'+v.body.substring(0,80)+'...</div>';
sub.onclick=function(e){e.stopPropagation();mp.flyTo([place.lat,place.lng],15,{duration:0.8});setActive(place.id);showDetail(place.title||v.title,fD(v.date),v.body);};
eL.appendChild(sub);
});
});
}
mp.setView([37.9720,23.7250],14);
}

document.getElementById('sourceToggle').addEventListener('click',function(e){
var btn=e.target.closest('.toggle-btn');if(!btn)return;
var s=btn.getAttribute('data-source');if(s===cSrc)return;
cSrc=s;document.querySelectorAll('#sourceToggle .toggle-btn').forEach(function(b){b.classList.toggle('active',b===btn);});
render();
});
document.getElementById('langToggle').addEventListener('click',function(e){
var btn=e.target.closest('.toggle-btn');if(!btn)return;
var l=btn.getAttribute('data-lang');if(l===cLang)return;
cLang=l;document.querySelectorAll('#langToggle .toggle-btn').forEach(function(b){b.classList.toggle('active',b===btn);});
loadAll(cLang);
});
document.getElementById('modeToggle').addEventListener('click',function(e){
var btn=e.target.closest('.toggle-btn');if(!btn)return;
var m=btn.getAttribute('data-mode');if(m===cMode)return;
cMode=m;document.querySelectorAll('#modeToggle .toggle-btn').forEach(function(b){b.classList.toggle('active',b===btn);});
render();
});
document.getElementById('detailBack').addEventListener('click',function(){dO.classList.remove('open');});
loadAll(cLang);
</script>
</body>
</html>
